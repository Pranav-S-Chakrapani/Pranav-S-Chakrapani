name: Update profile cards

on:
  schedule:
    # 03:17 UTC daily -- off the hour so it isn't queued behind everyone
    # else's on-the-hour cron jobs.
    - cron: "17 3 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "data/config.json"
      - "scripts/**"
      - ".github/workflows/update-cards.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install fonttools brotli

      - name: Fetch latest contribution data
        env:
          # A classic PAT with the `read:user` scope, added as a repo
          # secret. The default GITHUB_TOKEN can't read a user's
          # contribution calendar via the GraphQL API.
          GH_TOKEN: ${{ secrets.CONTRIB_READ_TOKEN }}
          GITHUB_LOGIN: Pranav-S-Chakrapani
        run: python scripts/fetch_contributions.py

      - name: Render cards
        run: python scripts/generate_cards.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/ data/contributions.json
          if git diff --cached --quiet; then
            echo "Nothing changed, skipping commit."
          else
            git commit -m "chore: refresh profile cards [skip ci]"
            git push
          fi
